<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Signing in…</title>
  <style>body{margin:0;display:grid;place-items:center;height:100vh;font:15px system-ui,sans-serif;background:#1d1442;color:#fff}</style>
</head>
<body>
  <p>Finishing Microsoft sign-in…</p>
  <!-- MSAL v5 redirect bridge: hands the sign-in result back to Morning Deck, then closes this window. -->
  <script src="../vendor/msal/msal-redirect-bridge.min.js"></script>
  <script>
    msalRedirectBridge.broadcastResponseToMainFrame().catch(function (e) {
      document.querySelector('p').textContent = 'Sign-in could not finish: ' + (e && e.message ? e.message : e) + '. You can close this window.';
    });
  </script>
</body>
</html>
