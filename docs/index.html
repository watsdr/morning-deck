<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1d1442">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Your bots' questions, one swipe each.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Morning Deck · demo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="stars"></div>
    <div class="tint" id="tint"></div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <img class="logo" src="icons/icon-192.png" alt="" width="40" height="40">
      <div class="brand">
        <h1>Morning Deck</h1>
        <p id="greeting">Good morning</p>
      </div>
      <div class="counter" id="counter" aria-live="polite"><span id="countNum">0</span><small>left</small></div>
    </header>
    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

    <div class="demo-banner" id="demoBanner" hidden><b>Demo</b><span>Try the swipes · nothing is saved</span></div>
    <div class="status-pill" id="statusPill" hidden></div>

    <main class="stage" id="stage">
      <div class="stack" id="stack" aria-live="polite"></div>
      <section class="cleared" id="cleared" hidden>
        <div class="sunrise" aria-hidden="true">
          <div class="rays"></div>
          <div class="sun"></div>
          <div class="horizon"></div>
        </div>
        <h2>All caught up</h2>
        <p class="cleared-sub" id="clearedSub">Nothing waiting on you right now.</p>
        <div class="summary-chips" id="summaryChips"></div>
        <ul class="summary-list" id="summaryList"></ul>
        <button class="ghost-btn" id="refreshBtn" type="button">Check for new cards</button>
      </section>
    </main>

    <nav class="actions" id="actions" aria-label="Answer buttons">
      <button class="act act-undo" id="btnUndo" type="button" aria-label="Undo last answer" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span>
      </button>
      <button class="act act-left big" data-g="left" type="button">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg><span data-label="left">No</span>
      </button>
      <button class="act act-down" data-g="down" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg><span data-label="down">Skip</span>
      </button>
      <button class="act act-up" data-g="up" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span data-label="up">Later</span>
      </button>
      <button class="act act-right big" data-g="right" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span data-label="right">Yes</span>
      </button>
      <button class="act act-tap3" data-g="tap3" type="button" aria-label="Details and custom reply">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Reply</span>
      </button>
    </nav>

    <footer class="safety">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Swipes record your answer; bots act on them later.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber"></div>
      <div class="sheet-scroll" id="sheetScroll">
        <div class="sheet-bot" id="sheetBot"></div>
        <h3 id="sheetTitle"></h3>
        <p class="sheet-body" id="sheetBody"></p>
        <div class="sheet-details" id="sheetDetails"></div>
        <div class="sheet-quick" id="sheetQuick"></div>
      </div>
      <div class="sheet-compose" id="sheetCompose">
        <label class="sheet-label" for="replyText" id="replyLabel">Your reply</label>
        <textarea id="replyText" rows="3" maxlength="5000" placeholder="Type your answer…" enterkeyhint="enter"></textarea>
        <div class="photo-row">
          <button type="button" class="photo-btn" id="photoBtn" aria-label="Add photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5Z"/><circle cx="12" cy="12.3" r="3.4"/></svg>
            <span id="photoBtnLabel">Add photo</span>
          </button>
          <input type="file" id="photoInput" accept="image/*" multiple hidden>
          <div class="thumbs" id="thumbs" aria-live="polite"></div>
        </div>
        <div class="sheet-buttons">
          <button type="button" class="ghost-btn" id="sheetCancel">Cancel</button>
          <button type="button" class="primary-btn" id="sheetSave" disabled>Save reply</button>
        </div>
        <p class="sheet-note">Saving records your reply. Nothing is sent from here.</p>
      </div>
    </section>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>window.MD_STATIC_DEMO = true;</script>
  <script src="app.js" defer></script>
</body>
</html>
